<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <div>
                <p class="eyebrow">Chrome extension</p>
                <h1>Lead Tracker</h1>
            </div>
            <span class="badge">Lead vault</span>
        </div>

        <div class="input-card">
            <label for="input-el">Save a useful URL</label>
            <input type="url" id="input-el" placeholder="https://example.com">

            <div class="button-row">
                <button id="save-input" class="primary-btn">
                    <span class="btn-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z" />
                            <path d="M17 21v-8H7v8" />
                            <path d="M7 3v5h8" />
                        </svg>
                    </span>
                    Save Input
                </button>
                <button id="save-tab" class="secondary-btn">
                    <span class="btn-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path d="M15 3h6v6" />
                            <path d="M10 14 21 3" />
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                        </svg>
                    </span>
                    Save Tab
                </button>
            </div>
        </div>

        <div class="list-header">
            <h2>Saved leads</h2>
            <button id="delete-btn" class="danger-btn">
                <span class="btn-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="M3 6h18" />
                        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                        <path d="m19 6-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                        <path d="M10 11v6" />
                        <path d="M14 11v6" />
                    </svg>
                </span>
                Delete All
            </button>
        </div>

        <ul id="ul-el"></ul>
    </div>

    <script src="script.js"></script>
</body>

</html>
